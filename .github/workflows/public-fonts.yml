name: Public font download

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.9
          cache: false
      - run: mise run public
      - run: mise exec -- uv run --frozen pytest -q tests/test_public.py
      - name: Package the public text edition
        run: |
          mise exec -- python tools/package_public.py
          sha256sum build/Codex-Fonts.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: build/Codex-Fonts.zip
          archive: false
          if-no-files-found: error
