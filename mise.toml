min_version = "2026.8.8"

[settings]
lockfile = true

[tools]
python = "3.13.15"
uv = "0.12.7"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"
SOURCE_DATE_EPOCH = "1787875200"

[tasks.install]
description = "Install the locked local font-production environment"
run = "uv sync --frozen"

[tasks.build]
description = "Build the private Nerd Font faces and webfonts"
depends = ["install"]
run = "uv run python -m codex_fonts.build"

[tasks.public]
description = "Build the redistributable OFL text faces without the icon patcher"
depends = ["install"]
run = "uv run python -m codex_fonts.build --public"

[tasks.specimen]
description = "Regenerate the browser specimen"
depends = ["build"]
run = "uv run python -m codex_fonts.specimen"

[tasks.test]
description = "Run readability, shaping, Nerd glyph, and monospace tests"
depends = ["build"]
run = "uv run pytest -q tests/test_fonts.py"

[tasks.check-public]
description = "Check the public text edition without Docker"
depends = ["public"]
run = ["uv run pytest -q tests/test_public.py", "uv run python -m codex_fonts.qa --public"]

[tasks.qa]
description = "Run FontBakery's universal profile"
depends = ["build"]
run = "uv run python -m codex_fonts.qa"

[tasks.check]
description = "Build, test, and run production font QA"
depends = ["test", "qa", "specimen"]
run = "mise run check-public"
